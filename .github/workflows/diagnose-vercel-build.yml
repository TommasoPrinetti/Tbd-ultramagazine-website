name: Diagnose Vercel build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-merge:
    name: Original merge on Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 56a1c30ffb93b5e9a65c4776584247b8e54c8c39
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run build
        env:
          VERCEL: '1'

  repaired-branch:
    name: Repaired branch on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 22
          - 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run build
        env:
          VERCEL: '1'

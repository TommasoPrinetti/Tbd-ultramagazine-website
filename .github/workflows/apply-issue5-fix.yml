name: Apply Issue 5 repair

on:
  push:
    branches:
      - fix/issue5-vercel-build

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue5-vercel-build
      - name: Apply focused Svelte repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/TBDUltramagazine_Issue5/+page.svelte')
          source = path.read_text()

          mount_before = "  onMount(() => {\n    loadScript('https://www.youtube.com/iframe_api', 'youtube-api');"
          mount_after = "  onMount(() => {\n    document.body.classList.add('radio-route');\n    loadScript('https://www.youtube.com/iframe_api', 'youtube-api');"
          body_directive = "\n<svelte:body class:radio-route />\n"

          if source.count(mount_before) != 1:
              raise SystemExit('Expected onMount insertion point was not found exactly once')
          if source.count(body_directive) != 1:
              raise SystemExit('Expected svelte:body directive was not found exactly once')

          source = source.replace(mount_before, mount_after, 1)
          source = source.replace(body_directive, '\n', 1)
          path.write_text(source)
          PY
      - name: Commit repair
        run: |
          rm .github/workflows/apply-issue5-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/TBDUltramagazine_Issue5/+page.svelte .github/workflows/apply-issue5-fix.yml
          git commit -m "Fix Issue 5 Svelte body class handling"
          git push origin HEAD:fix/issue5-vercel-build
